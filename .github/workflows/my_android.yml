name: Sadece Android Derlemesi

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'

      - name: Set up Android SDK & NDK
        uses: nsetup/setup-android-ndk@v1
        with:
          ndk-version: r26b

      - name: Install Python Dependencies & CMake
        run: |
          python -m pip install --upgrade pip
          pip install cmake ninja

      - name: Install Defold External Dependencies
        run: |
          python scripts/build.py install_ext

      - name: Build Engine for arm64-android
        run: |
          python scripts/build.py build_engine --platform=arm64-android

      - name: Upload Engine Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: defold-engine-arm64-android
          path: share/
