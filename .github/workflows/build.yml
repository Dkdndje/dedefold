name: Build Defold Engine (arm64-android)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      DEFOLD_HOME: ${{ github.workspace }}
      DYNAMO_HOME: ${{ github.workspace }}/tmp/dynamo_home
      PYTHONPATH: ${{ github.workspace }}/tmp/dynamo_home/lib/python:${{ github.workspace }}/build_tools:${{ github.workspace }}/tmp/dynamo_home/ext/lib/python

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'

      - name: Set up Android NDK
        run: |
          echo "y" | sudo ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxi-dev

      - name: Install Python Dependencies & CMake
        run: |
          python -m pip install --upgrade pip
          pip install cmake ninja

      - name: Install Defold External Dependencies
        run: |
          python scripts/build.py install_ext

      - name: Build Engine for arm64-android
        run: |
          python scripts/build.py build_engine --platform=arm64-android

      - name: Upload Engine Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: defold-engine-arm64-android
          path: tmp/dynamo_home/

      - name: Build Bob (embed local engine into bob.jar)
        run: |
          python scripts/build.py build_bob --skip-tests

      - name: Create Demo Project
        run: |
          rm -rf demo_project
          cp -r com.dynamo.cr/com.dynamo.cr.bob.test/test/proj demo_project
          sed -i 's/title = TMP/title = DedefoldDemo/' demo_project/game.project

          cat > demo_project/main/hello.label << 'EOF'
          text: 'Merhaba dedefold!'
          font: '/builtins/fonts/default.font'
          material: '/builtins/fonts/label-df.material'
          size { x: 600 y: 100 z: 0 }
          color { x: 1 y: 1 z: 1 w: 1 }
          outline { x: 0 y: 0 z: 0 w: 1 }
          shadow { x: 0 y: 0 z: 0 w: 1 }
          leading: 1.0
          tracking: 0.0
          pivot: PIVOT_CENTER
          blend_mode: BLEND_MODE_ALPHA
          line_break: false
          EOF

          cat > demo_project/main/main.go << 'EOF'
          components {
            id: "label"
            component: "/main/hello.label"
          }
          EOF

          cat > demo_project/main/main.collection << 'EOF'
          name: "main"
          instances {
            id: "go"
            prototype: "/main/main.go"
            position {
              x: 480.0
              y: 320.0
              z: 0.0
            }
            rotation {
              x: 0.0
              y: 0.0
              z: 0.0
              w: 1.0
            }
          }
          EOF

      - name: Bundle APK with Bob
        run: |
          java -jar com.dynamo.cr/com.dynamo.cr.bob/dist/bob.jar \
            --root demo_project \
            --platform arm64-android \
            --architectures arm64-android \
            --archive \
            --bundle-output ./apk-output \
            build bundle

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: defold-arm64-android-apk
          path: apk-output/
